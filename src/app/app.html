<header class="cabecera">
  <div class="contenedor cabecera-contenido">
    <a routerLink="/" class="marca" (click)="menuAbierto.set(false)">
      <img src="favicon.svg" alt="" width="36" height="36" />
      <span>Zona <strong>Safari</strong></span>
    </a>

    <button type="button" class="boton-menu" aria-label="Menú" (click)="menuAbierto.set(!menuAbierto())">☰</button>

    <nav class="menu" [class.abierto]="menuAbierto()">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" (click)="menuAbierto.set(false)">Inicio</a>
      <a routerLink="/explorar" routerLinkActive="activo" (click)="menuAbierto.set(false)">Explorar</a>
      <a routerLink="/guia" routerLinkActive="activo" (click)="menuAbierto.set(false)">Pokédex</a>
      <a routerLink="/coleccion" routerLinkActive="activo" (click)="menuAbierto.set(false)">
        Mi colección <span class="contador">{{ coleccion.total() }}</span>
      </a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="pie">
  <div class="contenedor">
    <p>Hecho por Erick Bermeo. Datos obtenidos de <a href="https://pokeapi.co" target="_blank">PokéAPI</a>.</p>
  </div>
</footer>
