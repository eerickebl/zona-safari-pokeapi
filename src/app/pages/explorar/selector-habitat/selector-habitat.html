<ul class="habitats">
  @for (habitat of habitats(); track habitat.nombre) {
    <li>
      <button
        type="button"
        class="habitat"
        [class.activo]="habitat.nombre === seleccionado()"
        [style.border-left-color]="habitat.color"
        [disabled]="bloqueado() && habitat.nombre !== seleccionado()"
        (click)="elegir.emit(habitat.nombre)"
      >
        <span class="texto">
          <span class="nombre">{{ habitat.etiqueta }}</span>
          <span class="barra">
            <span [style.width.%]="porcentaje(habitat)" [style.background-color]="habitat.color"></span>
          </span>
          <span class="cifra">{{ capturadas(habitat) }} de {{ habitat.especies.length }} especies capturadas</span>
        </span>
        <span class="muestras">
          @for (especie of habitat.especies.slice(0, 2); track especie.id) {
            <img [src]="sprite(especie.id)" [alt]="especie.nombre" width="48" height="48" loading="lazy" />
          }
        </span>
      </button>
    </li>
  }
</ul>
@if (bloqueado()) {
  <p class="nota">Termina el encuentro para cambiar de hábitat.</p>
}
